function progress(n){return `<div class="progress"><span style="width:${pct(n)}%"></span></div>`}

function practice(){return `${head("Luyện tập và kiểm tra","Chọn một hoạt động để bắt đầu. Các bài dưới đây là bài mẫu tương tác.","<button class='btn' onclick='go(\"results\")'>Xem lịch sử kết quả →</button>")}<div class="notice">Bài kiểm tra trên trang này chỉ dùng thử giao diện, không phải bài thi chính thức của Trường Đại học Văn Lang.</div><div class="grid layout3"><div class="card"><div class="staticon">🔤</div><h2 style="font-size:16px">Vocabulary Checkpoint 02</h2><p class="sub">Anh văn 1 · 5 câu hỏi · 5–8 phút</p><div class="minirow" style="margin:15px 0"><span class="mini-pill">Trắc nghiệm</span><span class="mini-pill">Chấm tự động</span></div><button class="btn primary" onclick="startQuiz()">Bắt đầu làm bài →</button></div><div class="card"><div class="staticon" style="background:#edf4ff;color:#4169e1">🎧</div><h2 style="font-size:16px">Listening Warm-up</h2><p class="sub">Anh văn 2 · luyện kỹ năng nghe</p><div class="minirow" style="margin:15px 0"><span class="mini-pill">Luyện tập tự do</span><span class="mini-pill">Demo</span></div><button class="btn" onclick="showListening()">Mở hoạt động →</button></div><div class="card"><div class="staticon" style="background:#eaf8f1;color:#16865c">📖</div><h2 style="font-size:16px">Reading Practice A</h2><p class="sub">Anh văn 1 · đọc hiểu ngắn</p><div class="minirow" style="margin:15px 0"><span class="mini-pill">Đọc hiểu</span><span class="mini-pill">5 phút</span></div><button class="btn" onclick="readArticle(3)">Luyện đọc →</button></div></div><div class="card" style="margin-top:18px"><div class="sectionhead"><div><h2>Lịch sử hoạt động</h2><p>Các kết quả demo đã ghi nhận</p></div></div><div class="tablewrap"><table><thead><tr><th>Hoạt động</th><th>Môn</th><th>Ngày</th><th>Điểm</th><th>Loại</th></tr></thead><tbody>${results.map(r=>`<tr><td><b>${r.title}</b></td><td>${r.course}</td><td>${r.date}</td><td><b>${r.score}/${r.max}</b></td><td>${r.type}</td></tr>`).join("")}</tbody></table></div></div>`}
const quiz=[{q:"Choose the correct greeting for 9:00 a.m.",opts:["Good night","Good morning","Good evening","Goodbye"],a:1,why:"“Good morning” thường dùng vào buổi sáng."},{q:"Complete: She ___ a student.",opts:["are","am","is","be"],a:2,why:"Với chủ ngữ “She”, động từ to be ở hiện tại là “is”."},{q:"Which word is a noun?",opts:["Quickly","Beautiful","Happiness","Run (verb)"],a:2,why:"“Happiness” là danh từ chỉ trạng thái hạnh phúc."},{q:"Choose the correct plural of “class”.",opts:["class","classies","classes","class's"],a:2,why:"Danh từ kết thúc bằng -s thường thêm -es."},{q:"Complete: I usually ___ breakfast at 7.",opts:["have","has","having","had to"],a:0,why:"Với “I” ở hiện tại đơn, dùng “have”."}];
function startQuiz(){quizAnswers={};quizSubmitted=false;showModal("Vocabulary Checkpoint 02",`<div class="notice">Bài luyện tập demo · 5 câu hỏi · Hãy chọn một đáp án cho mỗi câu.</div><div id="quizQuestions">${quiz.map((q,i)=>`<div class="question"><h3>${i+1}. ${q.q}</h3>${q.opts.map((o,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}" onchange="quizAnswers[${i}]=${j}"> ${o}</label>`).join("")}</div>`).join("")}</div><div class="readbar"><span id="quizProgress" class="sub">Đã trả lời 0/5 câu</span><button class="btn primary" onclick="submitQuiz()">Nộp bài và xem điểm</button></div>`);document.querySelectorAll('#modalBody input[type=radio]').forEach(el=>el.addEventListener('change',()=>{document.getElementById('quizProgress').textContent=`Đã trả lời ${Object.keys(quizAnswers).length}/5 câu`}))}
function submitQuiz(){let n=Object.keys(quizAnswers).length;if(n<5){toast("Bạn hãy trả lời đủ 5 câu trước khi nộp bài.");return}let correct=quiz.filter((q,i)=>quizAnswers[i]===q.a).length,score=correct*2;results.unshift({course:"Anh văn 1",title:"Vocabulary Checkpoint 02",date:"28/10/2026",score:score,max:10,type:"Luyện tập"});let detail=quiz.map((q,i)=>`<div class="question"><b>${i+1}. ${q.q}</b><p style="color:${quizAnswers[i]===q.a?'var(--green)':'var(--red)'}">${quizAnswers[i]===q.a?'✓ Chính xác':'✕ Chưa chính xác'} · Đáp án: ${q.opts[q.a]}</p><div class="sub">${q.why}</div></div>`).join("");document.getElementById("modalBody").innerHTML=`<div style="text-align:center;padding:15px"><div class="eyebrow">KẾT QUẢ BÀI LUYỆN TẬP DEMO</div><div style="font-size:48px;font-weight:900;color:var(--red)">${score}/10</div><p>Bạn trả lời đúng ${correct}/5 câu.</p><span class="badge">${correct>=4?'Làm tốt!':'Hãy xem lại phần giải thích bên dưới'}</span></div>${detail}<button class="btn primary" onclick="closeModal();go('results')">Xem kết quả học tập</button>`}
function showListening(){showModal("Listening Warm-up",`<div class="notice">Mô phỏng bài nghe: nội dung văn bản dưới đây dùng để luyện đọc/nghe cùng trình đọc màn hình; bản demo chưa phát tệp âm thanh thật.</div><h3>Campus Life</h3><p>“Hello, my name is Anna. I am a first-year student. I usually go to the library after class, and I practise English with my friends twice a week.”</p><p><b>Question:</b> Where does Anna usually go after class?</p><label class="option"><input type="radio" name="listen" value="0"> To the cafeteria</label><label class="option"><input type="radio" name="listen" value="1"> To the library</label><label class="option"><input type="radio" name="listen" value="2"> To the gym</label><button class="btn primary" onclick="checkListening()">Kiểm tra đáp án</button><div id="listenFeedback"></div>`)}
function checkListening(){let v=document.querySelector('input[name=listen]:checked');if(!v){toast("Hãy chọn một đáp án.");return}document.getElementById('listenFeedback').innerHTML=`<p style="color:${v.value==='1'?'var(--green)':'var(--red)'};margin-top:15px">${v.value==='1'?'✓ Chính xác!':'Chưa đúng. Đáp án là: To the library.'}</p>`}
function resultsPage(){return `${head("Kết quả học tập","Theo dõi lịch sử các bài luyện tập và bài đánh giá demo.","<button class='btn' onclick='exportResults()'>⇩ Xuất CSV</button>")}<div class="notice">Điểm hiển thị ở đây là điểm bài luyện tập trên website demo, không phải điểm tổng kết hoặc điểm chính thức của môn học.</div><div class="grid stats">${stat("Số lượt làm bài",results.length,"Lịch sử minh họa","✓")}${stat("Điểm trung bình",(results.reduce((a,r)=>a+r.score/r.max*10,0)/Math.max(1,results.length)).toFixed(1)+"/10","Tính từ danh sách demo","★")}${stat("Môn có kết quả",new Set(results.map(r=>r.course)).size,"Theo lịch sử hiện có","📘")}${stat("Bài gần nhất",results[0]?.date||"—","Ngày ghi nhận demo","◷")}</div><div class="card"><div class="filters"><input class="field grow" id="resultSearch" placeholder="Tìm tên bài..." oninput="filterResults()"><select class="field" id="resultCourse" onchange="filterResults()"><option value="">Tất cả môn</option>${courses.map(c=>`<option>${c.name}</option>`).join("")}</select><select class="field" id="resultType" onchange="filterResults()"><option value="">Tất cả loại</option><option>Luyện tập</option><option>Kiểm tra demo</option></select></div><div class="tablewrap"><table><thead><tr><th>Tên hoạt động</th><th>Môn học</th><th>Ngày thực hiện</th><th>Điểm</th><th>Loại</th><th>Trạng thái</th></tr></thead><tbody id="resultRows">${resultRows(results)}</tbody></table></div></div>`}
function resultRows(arr){return arr.map(r=>`<tr><td><b>${r.title}</b></td><td>${r.course}</td><td>${r.date}</td><td><b>${r.score}/${r.max}</b></td><td>${r.type}</td><td><span class="badge">Đã hoàn thành</span></td></tr>`).join("")||'<tr><td colspan="6" class="empty">Không có kết quả phù hợp.</td></tr>'}
function filterResults(){let q=document.getElementById("resultSearch").value.toLowerCase(),c=document.getElementById("resultCourse").value,t=document.getElementById("resultType").value;document.getElementById("resultRows").innerHTML=resultRows(results.filter(r=>r.title.toLowerCase().includes(q)&&(!c||r.course===c)&&(!t||r.type===t)))}
function noticesPage(){return `${head("Thông báo","Cập nhật hoạt động và nhắc nhở học tập.","<button class='btn' onclick='markAllRead()'>✓ Đánh dấu tất cả đã đọc</button>")}<div class="card"><div class="sectionhead"><div><h2>Hộp thư thông báo</h2><p id="noticeSummary">${notices.filter(n=>!n.read).length} thông báo chưa đọc</p></div><span class="badge pending">Demo</span></div>${notices.map((n,i)=>`<div class="timeline-item" style="margin:10px 0;background:${n.read?'#fff':'#fffafb'}"><span class="timeline-dot" style="background:${n.read?'#cbd2df':'var(--red)'}"></span><div style="flex:1"><strong>${n.title} ${n.read?'':'<span class=\"badge pending\">Mới</span>'}</strong><p>${n.desc}</p><div class="meta" style="margin-top:7px">${n.date}</div></div><button class="btn small" onclick="toggleNotice(${i})">${n.read?'Đánh dấu chưa đọc':'Đánh dấu đã đọc'}</button></div>`).join("")}</div>`}
function support(){return `${head("Hỗ trợ","Tìm câu trả lời nhanh hoặc gửi yêu cầu hỗ trợ (mô phỏng).")}<div class="grid layout2"><div class="card"><div class="sectionhead"><div><h2>❓ Câu hỏi thường gặp</h2><p>Thông tin sử dụng COMPASSENG</p></div></div><details class="helpitem"><summary>Tại sao dữ liệu có nhãn demo?</summary><p>Website hiện là bản thử nghiệm, chưa kết nối hệ thống quản lý học tập hoặc dữ liệu tài khoản thật.</p></details><details class="helpitem"><summary>Kết quả luyện tập có phải điểm chính thức?</summary><p>Không. Điểm chỉ phản ánh câu trả lời trong các bài mẫu trên website này.</p></details><details class="helpitem"><summary>Tôi có thể tải tài liệu không?</summary><p>Thư viện hiện mô phỏng thao tác xem tài liệu. Cần bổ sung file thực tế và phân quyền để triển khai tải xuống.</p></details><details class="helpitem"><summary>Làm sao để sử dụng trên điện thoại?</summary><p>Giao diện responsive; nhấn nút menu ở góc trên để mở thanh điều hướng.</p></details></div><div class="card"><div class="sectionhead"><div><h2>✉️ Gửi yêu cầu hỗ trợ</h2><p>Biểu mẫu demo, chưa gửi email thật</p></div></div><form id="supportForm"><label class="meta">Chủ đề yêu cầu</label><select class="field" name="topic" required style="width:100%;margin:6px 0 14px"><option value="">Chọn chủ đề</option><option>Tài khoản và đăng nhập</option><option>Tài liệu học tập</option><option>Luyện tập và kiểm tra</option><option>Góp ý giao diện</option><option>Khác</option></select><label class="meta">Email liên hệ (demo)</label><input class="field" name="email" type="email" placeholder="email@example.com" required style="width:100%;margin:6px 0 14px"><label class="meta">Nội dung</label><textarea class="field" name="message" rows="4" placeholder="Mô tả nội dung cần hỗ trợ..." required style="width:100%;margin:6px 0 14px;resize:vertical"></textarea><button class="btn primary" type="submit">Gửi yêu cầu →</button></form><div id="supportFeedback"></div></div></div>`}
function render(){document.getElementById("crumb").textContent=pageNames[currentPage];document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===currentPage));let views={home,path:pathPage,analytics,rules:rulesPage,materials:materialsPage,practice,results:resultsPage,notices:noticesPage,support};document.getElementById("content").innerHTML=(views[currentPage]||home)();document.getElementById("noticeCount").textContent=notices.filter(n=>!n.read).length||"";document.getElementById("topNotice").innerHTML=`♧ <span style="color:var(--red)">${notices.filter(n=>!n.read).length}</span>`;document.getElementById("sidebar").classList.remove("open");if(currentPage==="support"){document.getElementById("supportForm").addEventListener("submit",e=>{e.preventDefault();document.getElementById("supportFeedback").innerHTML='<p class="badge" style="margin-top:12px">Đã ghi nhận yêu cầu demo trên giao diện.</p>';e.target.reset()})}}
function go(p){currentPage=p;render();window.scrollTo({top:0,behavior:"smooth"})}
function toast(msg){let t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove("show"),2600)}
function showModal(title,body){document.getElementById("modalTitle").textContent=title;document.getElementById("modalBody").innerHTML=body;document.getElementById("modalback").classList.add("show")}
function closeModal(){document.getElementById("modalback").classList.remove("show")}
function openCourse(id){let c=courses.find(x=>x.id===id);showModal(c.name,`<div class="staticon">${c.icon}</div><h3>${c.level} · ${c.status}</h3><p>${c.desc}</p><p><b>Tiến độ demo: ${c.progress}%</b></p>${progress(c.progress)}<h3 style="margin-top:20px">Kỹ năng / mục tiêu gợi ý</h3>${["Listening","Speaking","Reading","Writing"].map((s,i)=>skill(s,c.skills[i])).join("")}<div class="notice" style="margin-top:15px">Nội dung và trạng thái môn học cần được cập nhật theo chương trình thực tế của sinh viên.</div><button class="btn primary" onclick="closeModal();go('practice')">Tìm bài luyện tập →</button>`)}
function readArticle(i){let a=articles[i]||articles[0];showModal(a.title,`<div class="meta">${a.cat} · ${a.time} · Bài đọc demo</div><p style="font-size:15px;margin-top:18px">${a.desc}</p><h3>Three practical ideas</h3><p>First, set a small and realistic goal. Second, connect English practice with your daily routine. Finally, review what you have learned and notice which strategies work best for you.</p><h3>Vocabulary</h3><div class="minirow"><span class="mini-pill">routine — thói quen</span><span class="mini-pill">practice — luyện tập</span><span class="mini-pill">improve — cải thiện</span></div><h3 style="margin-top:18px">Quick reflection</h3><p>What is one small action you can take today to practise English?</p><textarea class="field" id="reflection" rows="3" style="width:100%" placeholder="Ghi chú của bạn..."></textarea><button class="btn primary" style="margin-top:10px" onclick="toast('Đã lưu ghi chú trong phiên demo.');closeModal()">Lưu ghi chú demo</button>`)}
function showRule(i){let r=rules[i];showModal(r.title,`<span class="badge pending">${r.group}</span><p style="margin-top:15px">${r.desc}</p><div class="notice">Nội dung chi tiết này là phần minh họa cấu trúc hiển thị. Vui lòng thay bằng văn bản chính thức đã được phê duyệt trước khi đưa website vào sử dụng.</div><h3>Thông tin tài liệu</h3><p>Đối tượng: Sinh viên học các môn Anh văn 1–7<br>Đơn vị phụ trách: Cần cập nhật theo phân công chính thức<br>Ngày cập nhật: Chưa xác định</p><button class="btn" onclick="closeModal()">Đóng</button>`)}
function openMaterial(i){let m=materials[i];showModal(m.title,`<span class="badge pending">${m.type}</span> <span class="badge">${m.course}</span><p style="margin-top:15px">${m.desc}</p><p><b>Kỹ năng:</b> ${m.skill}<br><b>Ngày cập nhật:</b> ${m.date}</p><div class="notice">Đây là thẻ tài liệu mẫu, chưa đính kèm tệp thật. Quản trị viên cần tải lên tài liệu đã được duyệt.</div><button class="btn primary" onclick="toast('Tệp demo chưa được đính kèm.');">Xem / tải tài liệu</button>`)}
function toggleTask(btn){btn.classList.toggle("done");btn.textContent=btn.classList.contains("done")?"✓":"";let left=[...document.querySelectorAll("#taskList .task-check")].filter(b=>!b.classList.contains("done")).length;let counter=document.getElementById("taskCounter");if(counter)counter.textContent=left+" việc còn lại"}
function toggleNotice(i){notices[i].read=!notices[i].read;render()}
function markAllRead(){notices.forEach(n=>n.read=true);render();toast("Đã đánh dấu tất cả thông báo đã đọc.")}
function exportResults(){let rows=[["Hoạt động","Môn","Ngày","Điểm","Điểm tối đa","Loại"],...results.map(r=>[r.title,r.course,r.date,r.score,r.max,r.type])];let csv=rows.map(row=>row.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(",")).join("\r\n");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8;"}));a.download="COMPASSENG_ket_qua_demo.csv";a.click();URL.revokeObjectURL(a.href);toast("Đã xuất file CSV demo.")}
document.getElementById("nav").addEventListener("click",e=>{let b=e.target.closest("button[data-page]");if(b)go(b.dataset.page)});
document.getElementById("mobileMenu").addEventListener("click",()=>document.getElementById("sidebar").classList.toggle("open"));
document.getElementById("closeModal").addEventListener("click",closeModal);
document.getElementById("modalback").addEventListener("click",e=>{if(e.target.id==="modalback")closeModal()});
document.getElementById("topNotice").addEventListener("click",()=>go("notices"));
document.getElementById("globalSearch").addEventListener("keydown",e=>{if(e.key==="Enter"){let q=e.target.value.toLowerCase();if(["tài liệu","pdf","reading","listening"].some(x=>q.includes(x)))go("materials");else if(["bài","luyện","quiz","kiểm tra"].some(x=>q.includes(x)))go("practice");else if(q.includes("quy định"))go("rules");else {go("home");toast("Thử tìm: tài liệu, bài luyện tập hoặc quy định.")}}});
render();
</script>
</body></html>
